[pytest]
testpaths = evaluation/regression evaluation/concept_graph backend/tests
# graph_integrity_tests.py ends in `_tests.py`, which pytest's default
# `test_*.py` / `*_test.py` patterns do NOT match — without this line the whole
# concept-graph suite is silently skipped and the run still reports green.
python_files = test_*.py *_test.py *_tests.py
markers =
    llm: test performs a live LLM call (costs quota, subject to rate limits)
filterwarnings =
    ignore::DeprecationWarning
    ignore::RuntimeWarning
