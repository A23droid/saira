# Local development dependencies.
#
# Neo4j was removed in the LLM-Wiki / OKF migration: compiled knowledge
# lives in the knowledge store (filesystem or S3) and its search index
# lives in PostgreSQL, so there is no graph database to run.

services:
  postgres:
    image: postgres:15-alpine
    container_name: saira_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saira
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
